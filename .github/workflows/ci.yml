name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Cancel in-progress runs for the same workflow and branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0   # needed for git describe

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          g++ \
          libboost-all-dev \
          libssl-dev \
          zlib1g-dev \
          libspdlog-dev \
          nlohmann-json3-dev \
          clang-format \
          nodejs \
          npm \
          python3 \
          python3-pip

    - name: Install Node dependencies
      run: |
        cd webui
        npm install

    - name: Install Python dependencies
      run: |
        pip3 install --break-system-packages requests websockets

    - name: Build Vue UI
      run: |
        cd webui
        npm run build

    - name: Configure CMake
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON

    - name: Build
      run: |
        cmake --build build -- -j$(nproc)

    - name: Run unit tests
      run: |
        cd build
        ctest --output-on-failure

    - name: Start server for integration tests
      run: |
        ./build/jetson --port 8081 &
        SERVER_PID=$!
        echo "Server PID: $SERVER_PID"
        
        # Wait for server to be ready
        for i in {1..30}; do
          if curl -s http://localhost:8081/ > /dev/null 2>&1; then
            echo "Server is ready"
            break
          fi
          echo "Waiting for server... ($i/30)"
          sleep 1
        done
        
        # Update test scripts to use port 8081
        sed -i 's/:8080/:8081/g' tests/integration/test-api.py
        sed -i 's/:8080/:8081/g' tests/integration/test_auth.py
        sed -i 's/:8080/:8081/g' tests/integration/test_websocket.py

    - name: Run integration tests
      run: |
        python3 tests/integration/test-api.py
        python3 tests/integration/test_auth.py
        python3 tests/integration/test_websocket.py

    - name: Stop server
      if: always()
      run: |
        pkill -f "jetson --port 8081" || true

    - name: Compute version
      id: version
      run: |
        VER=$(git describe --tags --always --dirty 2>/dev/null || echo "v1.0.0-dev")
        echo "version=${VER}" >> "$GITHUB_OUTPUT"
        echo "pkgname=jetson-bmcweb-${VER}-linux-x86_64" >> "$GITHUB_OUTPUT"

    - name: Assemble package
      run: |
        PKG="${{ steps.version.outputs.pkgname }}"
        mkdir -p "pkg/${PKG}"
        cp build/jetson "pkg/${PKG}/jetson"
        cp -r webui/dist "pkg/${PKG}/webui"
        tar -czf "${PKG}.tar.gz" -C pkg "${PKG}"
        echo "Package contents:"
        tar -tzf "${PKG}.tar.gz"

    - name: Upload package artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.version.outputs.pkgname }}
        path: ${{ steps.version.outputs.pkgname }}.tar.gz
        retention-days: 30
